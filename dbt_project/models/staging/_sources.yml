version: 2

sources:
  - name: raw
    description: Raw tables loaded 1:1 from gs://<project>-raw. dbt reads these and never writes here.
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('BIGQUERY_RAW_DATASET', 'raw') }}"
    tables:
      - name: stac_items
        description: Sentinel-2 STAC item metadata, one row per (item_id, region).
      - name: customers
        description: Synthetic customers.
      - name: aois
        description: Synthetic areas of interest, one per order target; FK to customers.
      - name: orders
        description: Synthetic orders.
